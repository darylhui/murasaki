<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Privacy lock: this page may only load its own files, and may only talk to
    a local AI server on this computer (Ollama). The browser blocks every other
    network request, so nothing typed here can be sent to the internet.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src http://localhost:11434 http://127.0.0.1:11434; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <!-- Keep the page out of search engines if it is hosted online. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Shift Hub</title>
  <meta name="theme-color" content="#6b2fa6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Sections">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">AF</span>
        <span class="brand-text">Shift Hub<small></small></span>
      </div>
      <button class="nav-btn" data-tab="today">Today</button>
      <button class="nav-btn" data-tab="followups">Prospect &amp; Trial <span class="count" id="fu-count" hidden></span></button>
      <button class="nav-btn" data-tab="payments">Payments <span class="count" id="dues-count" hidden></span></button>
      <button class="nav-btn" data-tab="calc">Calculators</button>
      <button class="nav-btn" data-tab="scripts">Scripts</button>
      <button class="nav-btn" data-tab="onboarding">Onboarding</button>
      <button class="nav-btn" data-tab="ask">Ask &amp; Redact</button>
      <button class="nav-btn" data-tab="settings">Settings</button>
      <p class="nav-foot">Data stays on this computer.</p>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
