# Publishes the shift-hub folder (and nothing else) to GitHub Pages
# whenever main changes. PITCH.md and the rest of the repo stay private.
name: Deploy Shift Hub to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["shift-hub/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: shift-hub
      - id: deployment
        uses: actions/deploy-pages@v4
